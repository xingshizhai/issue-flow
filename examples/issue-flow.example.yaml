version: 1

provider:
  type: gitee
  owner: example-owner
  repo: example-repo
  token_env: GITEE_TOKEN
  # Optional: enterprise Kanban issue_state sync (Open API still used for labels/lease).
  # enterprise:
  #   enabled: true
  #   path: example-enterprise   # or id: 12345
  #   token_env: GITEE_ENT_MCP_ACCESS_TOKEN
  #   api_base: https://api.gitee.com/enterprises

workflow:
  # Gitee forbids ":" in label names; prefer hyphens (length 2–20).
  ready_label: agent-ready
  claimed_label: agent-claimed
  working_label: agent-working
  blocked_label: agent-blocked
  review_label: agent-review
  done_label: agent-done
  lease_minutes: 120
  auto_close: false
  # Sync Gitee native Issue state (open/progressing/closed/rejected).
  sync_provider_state: true
  provider_states:
    ready: open
    claimed: progressing
    working: progressing
    blocked: open
    review: progressing
    done: closed
  # Optional enterprise Kanban titles (requires provider.enterprise.enabled).
  # enterprise_states:
  #   claimed: 修复中
  #   working: 修复中
  #   review: 已修复

project:
  instruction_files:
    - AGENTS.md
    - CLAUDE.md

validation:
  commands:
    - argv: ["go", "test", "./..."]
      timeout: 10m

git:
  branch_pattern: "{type}/issue-{number}-{slug}"
  allow_commit: false
  allow_push: false
  allow_pull_request: false

automation:
  level: patch

security:
  redact_keys:
    - password
    - token
    - cookie
    - authorization
    - api_key
    - secret
