version: 1

provider:
  type: gitee
  owner: example-owner
  repo: example-repo
  token_env: GITEE_TOKEN

workflow:
  # Gitee forbids ":" in label names; prefer hyphens (length 2–20).
  ready_label: agent-ready
  claimed_label: agent-claimed
  working_label: agent-working
  blocked_label: agent-blocked
  review_label: agent-review
  done_label: agent-done
  lease_minutes: 120
  auto_close: false
  # Sync Gitee native Issue state (open/progressing/closed/rejected).
  sync_provider_state: true
  provider_states:
    ready: open
    claimed: progressing
    working: progressing
    blocked: open
    review: progressing
    done: closed

project:
  instruction_files:
    - AGENTS.md
    - CLAUDE.md

validation:
  commands:
    - argv: ["go", "test", "./..."]
      timeout: 10m

git:
  branch_pattern: "{type}/issue-{number}-{slug}"
  allow_commit: false
  allow_push: false
  allow_pull_request: false

automation:
  level: patch

security:
  redact_keys:
    - password
    - token
    - cookie
    - authorization
    - api_key
    - secret
